  ws: "^8.20.0"
  vitest: "^4.1.2"
  "@sinclair/typebox": "0.34.49"
  "google-auth-library": "^10.6.2"
  "markdown-it": "^14.1.1"
  nostr-tools: "^2.23.3"
  signal-utils: "0.21.1"
